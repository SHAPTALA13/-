<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChatGPT</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><div class="brand"><span class="dot"></span>ChatGPT</div><button id="settings" title="Настройки">⚙</button></header>
  <main id="chat"></main>
  <form id="form">
    <textarea id="input" rows="2" placeholder="Напиши сообщение…" autocomplete="off"></textarea>
    <button id="send" type="submit">➤</button>
  </form>
  <script src="popup.js"></script>
</body>
</html>
